name: Application checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies and test enhancement model
        run: |
          python -m pip install -r requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python setup_model.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Python application
        run: python -m pytest tests -q
      - name: Test JavaScript behavior
        run: node --test tests/test_atlas_ui.cjs tests/test_cefca_ui.cjs tests/test_flight.cjs tests/test_flight_controls.cjs tests/test_map_panels.cjs tests/test_route_timeline.cjs tests/test_route_player.cjs tests/test_narration_ui.cjs tests/spatial-math.test.js tests/test_sdss_ui.cjs tests/test_telescope_live.cjs tests/test_pixel_mapping_math.cjs tests/test_pixel_mapping.cjs
